services:
  # ----------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: finrisk-backend
    env: python
    region: singapore
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0

  # ----------------------------------------------------
  # 2. React Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: finrisk-frontend
    env: static
    region: singapore
    plan: free
    rootDir: Frontend
    buildCommand: npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        fromService:
          type: web
          name: finrisk-backend
          property: host
